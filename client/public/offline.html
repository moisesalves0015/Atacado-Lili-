<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f5b63" />
    <title>Venda Atacado — Sem conexão</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f7fbf8; color: #173f42; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 360px; padding: 28px; border: 1px solid #dcebe6; border-radius: 22px; background: white; text-align: center; box-shadow: 0 14px 45px rgba(15, 91, 99, .08); }
      .mark { width: 64px; height: 64px; margin: 0 auto 18px; display: grid; place-items: center; border-radius: 20px; background: #0f5b63; color: white; font-weight: 800; font-size: 20px; }
      h1 { margin: 0; font-size: 21px; } p { color: #6d8584; line-height: 1.55; font-size: 14px; }
      button { border: 0; border-radius: 10px; padding: 11px 16px; background: #0f5b63; color: white; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body><main><div class="mark">VA</div><h1>Sem conexão</h1><p>O Venda Atacado precisa de internet para carregar os dados salvos com segurança. Verifique sua conexão e tente novamente.</p><button onclick="location.reload()">Tentar novamente</button></main></body>
</html>
